# searchRight - lokale ontwikkelomgeving
# Start alles met:  docker compose up -d
# Open daarna:      http://localhost:8088

services:
  # PHP-FPM: hier draait de Laravel-code
  app:
    build:
      context: ./docker/php
    container_name: searchright-app
    working_dir: /var/www/html
    environment:
      COMPOSER_PROCESS_TIMEOUT: 0
    volumes:
      - ./:/var/www/html
      # vendor in een eigen volume: veel sneller op Windows
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  # Nginx: webserver die verzoeken doorgeeft aan PHP-FPM
  web:
    image: nginx:1.27-alpine
    container_name: searchright-web
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # MySQL: de database
  db:
    image: mysql:8.4
    container_name: searchright-db
    environment:
      MYSQL_DATABASE: searchright
      MYSQL_USER: searchright
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usearchright", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Node: Vite dev-server voor CSS (Tailwind) en JavaScript
  node:
    image: node:22-alpine
    container_name: searchright-node
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      # node_modules in een eigen volume: veel sneller op Windows
      - node_modules:/var/www/html/node_modules

volumes:
  dbdata:
  vendor:
  node_modules:
